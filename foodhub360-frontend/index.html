<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FoodHub360 MVP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="app"></main>

    <template id="shell-template">
        <div class="app-shell">
            <aside class="sidebar">
                <img class="brand-logo" src="assets/LogoMarca.jpg" alt="FoodHub360">
                <nav id="side-nav" class="nav flex-column gap-2"></nav>
                <button id="logout-button" class="btn btn-danger logout-btn" type="button">
                    <span class="logout-icon">↪</span> Sair
                </button>
            </aside>
            <section class="content-area">
                <header class="topbar">
                    <input id="global-search" class="form-control search-input" type="search" placeholder="Pesquisar">
                    <span id="session-pill" class="session-pill"></span>
                </header>
                <div id="view" class="view-wrap"></div>
            </section>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="backend.js"></script>
    <script src="app.js"></script>
</body>
</html>
